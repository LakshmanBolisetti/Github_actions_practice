<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
<title id="title">Phase 1 S3 validation</title><desc id="desc">GitHub Actions assumes an IAM role with OIDC, checks its identity, uploads a test object to an S3 bucket, and verifies object metadata.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#53657a"/></marker><style>.h{font:700 28px Arial;fill:#12263a}.t{font:700 19px Arial;fill:#12263a}.s{font:15px Arial;fill:#41556b}.n{stroke:#8da0b5;stroke-width:2;rx:16}.ar{stroke:#53657a;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1200" height="590" fill="#f5f8fc"/><text x="600" y="50" class="h" text-anchor="middle">Phase 1 — Validate GitHub OIDC with S3</text>
<rect x="50" y="120" width="245" height="125" fill="#e8f0ff" class="n"/><text x="172" y="165" class="t" text-anchor="middle">GitHub Actions</text><text x="172" y="195" class="s" text-anchor="middle">OIDC token</text><text x="172" y="220" class="s" text-anchor="middle">id-token: write</text>
<path d="M295 182 H355" class="ar"/>
<rect x="365" y="120" width="245" height="125" fill="#e9f7ee" class="n"/><text x="487" y="165" class="t" text-anchor="middle">AWS IAM + STS</text><text x="487" y="195" class="s" text-anchor="middle">Trust policy check</text><text x="487" y="220" class="s" text-anchor="middle">Temporary credentials</text>
<path d="M610 182 H670" class="ar"/>
<rect x="680" y="120" width="245" height="125" fill="#fff3df" class="n"/><text x="802" y="165" class="t" text-anchor="middle">IAM role</text><text x="802" y="195" class="s" text-anchor="middle">Limited S3 policy</text><text x="802" y="220" class="s" text-anchor="middle">Bucket + prefix scope</text>
<path d="M802 245 V310 H570 V355" class="ar"/>
<rect x="390" y="365" width="360" height="135" fill="#e8f0ff" class="n"/><text x="570" y="410" class="t" text-anchor="middle">Amazon S3 test bucket</text><text x="570" y="440" class="s" text-anchor="middle">s3://bucket/oidc-test/oidc-test.txt</text><text x="570" y="470" class="s" text-anchor="middle">Upload → head-object verification</text>
<rect x="970" y="120" width="180" height="380" fill="#fff" class="n"/><text x="1060" y="165" class="t" text-anchor="middle">Checks</text><text x="990" y="220" class="s">1. sts</text><text x="990" y="245" class="s">get-caller</text><text x="990" y="270" class="s">-identity</text><text x="990" y="330" class="s">2. s3 cp</text><text x="990" y="390" class="s">3. s3api</text><text x="990" y="415" class="s">head-object</text><text x="990" y="470" class="s">4. Check</text><text x="990" y="495" class="s">S3 console</text>
</svg>
