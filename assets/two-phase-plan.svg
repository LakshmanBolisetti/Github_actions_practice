<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">Two-phase GitHub Actions AWS OIDC learning plan</title><desc id="desc">Phase 1 validates GitHub OIDC with S3. Phase 2 reuses the identity provider and IAM role to access EKS through an access entry.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#53657a"/></marker><style>.h{font:700 28px Arial;fill:#12263a}.t{font:700 20px Arial;fill:#12263a}.s{font:16px Arial;fill:#41556b}.box{stroke:#8da0b5;stroke-width:2;rx:18}.ar{stroke:#53657a;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1200" height="470" fill="#f5f8fc"/><text x="600" y="55" text-anchor="middle" class="h">Implementation in two phases</text>
<rect x="55" y="110" width="500" height="290" fill="#eaf2ff" class="box"/><text x="305" y="155" text-anchor="middle" class="t">Phase 1 — Basic AWS connection</text>
<text x="95" y="205" class="s">1. Create GitHub OIDC provider in IAM</text><text x="95" y="245" class="s">2. Create role + repository/branch trust</text><text x="95" y="285" class="s">3. Attach least-privilege S3 policy</text><text x="95" y="325" class="s">4. Run get-caller-identity</text><text x="95" y="365" class="s">5. Upload and verify a test object</text>
<path d="M565 255 H630" class="ar"/>
<rect x="645" y="110" width="500" height="290" fill="#ecf8ef" class="box"/><text x="895" y="155" text-anchor="middle" class="t">Phase 2 — Amazon EKS</text>
<text x="685" y="205" class="s">1. Add eks:DescribeCluster permission</text><text x="685" y="245" class="s">2. Enable/use EKS Access Entries</text><text x="685" y="285" class="s">3. Map IAM role to EKS access policy</text><text x="685" y="325" class="s">4. Configure kubeconfig and kubectl</text><text x="685" y="365" class="s">5. Validate kubectl get pods</text>
</svg>
