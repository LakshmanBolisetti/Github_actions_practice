<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">GitHub Actions to AWS using OIDC</title><desc id="desc">GitHub Actions requests an OIDC token, AWS IAM validates it, STS issues temporary credentials for an IAM role, and the role accesses S3 or EKS.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#53657a"/></marker><style> .h{font:700 30px Arial,sans-serif;fill:#12263a}.t{font:700 20px Arial,sans-serif;fill:#12263a}.s{font:16px Arial,sans-serif;fill:#41556b}.small{font:14px Arial,sans-serif;fill:#41556b}.node{stroke:#9aabbd;stroke-width:2;rx:18}.arrow{stroke:#53657a;stroke-width:3;fill:none;marker-end:url(#arrow)} </style></defs>
<rect width="1200" height="760" fill="#f5f8fc"/>
<text x="600" y="58" text-anchor="middle" class="h">GitHub Actions → AWS OIDC authentication</text>
<rect x="390" y="100" width="420" height="100" class="node" fill="#e8f0ff"/><text x="600" y="140" text-anchor="middle" class="t">GitHub Actions</text><text x="600" y="170" text-anchor="middle" class="s">Workflow requests an OIDC JWT</text>
<path d="M600 200 V260" class="arrow"/><text x="625" y="236" class="small">OIDC token</text>
<rect x="390" y="270" width="420" height="100" class="node" fill="#e9f7ee"/><text x="600" y="310" text-anchor="middle" class="t">AWS IAM OIDC Identity Provider</text><text x="600" y="340" text-anchor="middle" class="s">token.actions.githubusercontent.com</text>
<path d="M600 370 V430" class="arrow"/><text x="625" y="405" class="small">Validate aud + sub claims</text>
<rect x="390" y="440" width="420" height="100" class="node" fill="#fff3df"/><text x="600" y="480" text-anchor="middle" class="t">AWS STS + IAM Role</text><text x="600" y="510" text-anchor="middle" class="s">AssumeRoleWithWebIdentity → temporary credentials</text>
<path d="M600 540 V585 H300 V620" class="arrow"/><path d="M600 585 H900 V620" class="arrow"/>
<rect x="110" y="630" width="380" height="90" class="node" fill="#e8f0ff"/><text x="300" y="668" text-anchor="middle" class="t">Amazon S3</text><text x="300" y="696" text-anchor="middle" class="s">Test bucket: upload / read object</text>
<rect x="710" y="630" width="380" height="90" class="node" fill="#f1eaff"/><text x="900" y="668" text-anchor="middle" class="t">Amazon EKS</text><text x="900" y="696" text-anchor="middle" class="s">Access Entry → Kubernetes API</text>
</svg>
