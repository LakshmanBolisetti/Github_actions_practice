name: creating a workflow for docker image creation of the source code

on:
  push:
    branches:
      - master
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: checkout repository
              uses: actions/checkout@3
            - name: set up java
              uses: actions/setup-java@v3
              with:
                distribution: 'temurin'
                java-version: '21'
            - name: checking the java version
              run: java -version

            - name: checking the maven version
              run: mvn -version

            - name: Build with Maven
              run: mvn clean install

            - name: checking the build artifacts
              run: find . -name "*.jar"
            
            - name: setup docker
              uses: docker/setup-buildx-action@v4

            - name: checking the docker version
              run: docker --version
            
            - name: checking the docker buildx version
              run: docker buildx version

            - name: checking the docker images
              run: docker images
            
            - name: Build Docker image
              run: docker build -t my-java-app .

            - name: checking the built docker image
              run: docker images
