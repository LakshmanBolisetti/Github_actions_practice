name: using the uses keyword to call the actions from the marketplace
on: workflow_dispatch

permissions:
  contents: write

jobs:
  job-1:
    runs-on: ubuntu-latest
    steps:
      - name: calling the checkout action
        uses: actions/checkout@v7
        with:
            token: ${{ secrets.GITHUB_TOKEN }}

      - name: calling the setup-java action
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: build the java application
        run: |
         java -version
         echo " THE BRANCH IS >>> ${{ github.ref }}"
         mvn -version
         mvn clean install
     
      - name: Commit files
        run: |
         git config --local user.email "bolisetti33@gmail.com"
         git config --local user.name "Lakshman Bolisetti"
         git add .
         git commit -m "Add changes from github workflow"
         git push -u origin master
